# PASTE THIS over the existing `location /uploads/ { … }` block in
# /etc/nginx/sites-available/redgo-v2.conf — inside the `listen 443` server block.
#
# Do NOT replace the whole file. Your existing config already handles /, /api/,
# /socket.io/, TLS and client_max_body_size correctly; only this block changes.
#
#   sudo cp /etc/nginx/sites-available/redgo-v2.conf ~/redgo-v2.conf.bak-$(date +%F)
#   sudo nano /etc/nginx/sites-available/redgo-v2.conf
#   sudo nginx -t && sudo systemctl reload nginx

location /uploads/ {
    alias /var/www/uploads/;

    # Filenames embed a random id and are never reused, so the bytes behind a
    # URL never change — safe to cache immutably.
    #
    # Do NOT also use `expires 1y;` here: it emits its own Cache-Control and you
    # end up with two conflicting headers on every response.
    add_header Cache-Control "public, max-age=31536000, immutable" always;

    # redgoindia.cloud and redgo.in both serve the app, but every stored URL
    # points at redgo.in — so images are cross-origin for redgoindia.cloud
    # visitors. These two headers are what make that work.
    add_header Access-Control-Allow-Origin  "*" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options       "nosniff" always;

    access_log off;
    autoindex off;
    try_files $uri =404;

    # Deny-list only — these nested blocks must NOT re-declare root/alias
    # (regex location + alias is a known nginx misconfiguration).
    #
    # .json matters specifically: cloudinary_metadata.json is a 26MB inventory
    # of every asset, including KYC documents.
    location ~* ^/uploads/.*\.(json|zip|gz|tar|sql|txt|md|env|log)$ {
        deny all;
    }
    # Uploaded content must never be interpreted as code. SVG included: it
    # executes script when served inline from your own origin.
    location ~* ^/uploads/.*\.(php|phtml|phar|js|mjs|cjs|html?|htaccess|sh|py|pl|rb|svg|xml)$ {
        deny all;
    }
    location ~ /uploads/\. { deny all; }   # dotfiles
}
