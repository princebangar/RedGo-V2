# RedGo — REFERENCE ONLY. Do not install this file as-is.
#
# The live server already has a working /etc/nginx/sites-available/redgo-v2.conf.
# To migrate uploads you only need to replace its `location /uploads/` block —
# use deploy/nginx/uploads-location.conf for that.
#
# This file documents the full intended shape, matched to the live server:
#   nginx 1.30.3, `user root`, client_max_body_size 64M set globally
#   frontend root  /var/www/redgo-v2
#   uploads        /var/www/uploads
#   cert           /etc/letsencrypt/live/redgo.in/
#   server_name    redgoindia.cloud www.redgoindia.cloud redgo.in www.redgo.in

# Cache-friendly upstream for the Node API
upstream redgo_api {
    server 127.0.0.1:5000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name redgo.in www.redgo.in redgoindia.cloud www.redgoindia.cloud;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    # redgo.in is canonical — ASSET_BASE_URL must match it. redgoindia.cloud is
    # kept so existing links and the email logo URL keep resolving.
    server_name redgo.in www.redgo.in redgoindia.cloud www.redgoindia.cloud;

    ssl_certificate     /etc/letsencrypt/live/redgo.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/redgo.in/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    root /var/www/redgo-v2;   # Frontend build output (deploy.sh copies dist/* here)
    index index.html;

    # Already set globally in nginx.conf on this server as 64M. Must stay
    # >= MAX_UPLOAD_SIZE_MB (25) or uploads fail at the proxy before Node sees them.
    client_max_body_size 64M;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    # Images are already compressed — do not waste CPU re-gzipping them.

    # ------------------------------------------------------------------
    # UPLOADS — served entirely by nginx, straight from disk.
    # This block is the whole point of the Cloudinary migration.
    # ------------------------------------------------------------------
    location /uploads/ {
        alias /var/www/uploads/;

        # Filenames embed a random id and are never reused, so the bytes behind a
        # URL never change — safe to cache immutably for a year.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        # Allow the images to be used from other origins (apps, canvas, CDNs).
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options       "nosniff" always;

        access_log off;
        autoindex off;
        try_files $uri =404;

        # Deny-list, not an allow-list: a nested regex location with `alias` is a
        # well-known nginx misconfiguration, so these blocks carry `deny all`
        # only and never re-declare a root.
        #
        # .json matters specifically — cloudinary_metadata.json is a 26MB
        # inventory of every asset, including KYC documents.
        location ~* ^/uploads/.*\.(json|zip|gz|tar|sql|txt|md|env|log)$ {
            deny all;
        }
        # Uploaded content must never be interpreted as code. SVG is included:
        # it executes script when served inline from your own origin.
        location ~* ^/uploads/.*\.(php|phtml|phar|js|mjs|cjs|html?|htaccess|sh|py|pl|rb|svg|xml)$ {
            deny all;
        }
        location ~ /uploads/\. { deny all; }   # dotfiles
    }

    # Legacy: anything that still asks Node for an upload gets sent to disk instead.
    location = /uploads { return 301 /uploads/; }

    # ------------------------------------------------------------------
    # API
    # ------------------------------------------------------------------
    location /api/ {
        proxy_pass         http://redgo_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
        proxy_read_timeout 120s;
        proxy_request_buffering off;   # stream multipart uploads through to Node
    }

    location /socket.io/ {
        proxy_pass         http://redgo_api;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location = /health { proxy_pass http://redgo_api; access_log off; }

    # ------------------------------------------------------------------
    # SPA
    # ------------------------------------------------------------------
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|webp|avif|ico)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
